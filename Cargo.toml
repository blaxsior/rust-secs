[workspace]
members = [
    "app-std",
    "secs-common",
    "secs-ii", 
    "secs-model",
    "secs-runtime-core",
    "secs-runtime",
    "secs-runtime-handler",
    "secs-runtime-web",
    "secs-runtime-std",
    "secs-transport",
]
resolver = "3"
[workspace.dependencies]
secs-common = { path = "secs-common" }
secs-runtime-std = { path = "secs-runtime-std" }
secs-ii = { path = "secs-ii" }
secs-model = { path = "secs-model" }
secs-runtime-core = { path = "secs-runtime-core" }
secs-runtime = { path = "secs-runtime" }
secs-runtime-handler = { path = "secs-runtime-handler" }
secs-runtime-web = { path = "secs-runtime-web" }
secs-transport = { path = "secs-transport" }

thiserror = "2.0.18"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
log = "0.4.33"
env_logger = "0.11.11"
futures = "0.3.31"
